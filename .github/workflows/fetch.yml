name: Fetch Posts
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install -r requirements.txt
      - name: Run tasks
        env:
          DATABASE_URL: sqlite:///data.db
        run: |
          python -m backend.main init
          python -m backend.main fetch
          python -m backend.main classify
          python -m backend.main draft
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update data'
          branch: $GITHUB_REF_NAME
